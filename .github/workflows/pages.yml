name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        shell: bash
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}
          COUNTRY: ${{ vars.COUNTRY }}
          SITE: ${{ vars.SITE }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          shopt -s nocasematch
          default_site=
          case "$REPOSITORY_NAME" in
            radio-hrvatska.github.io) default_country=hr ;;
            sveriges-radio.github.io) default_country=se ;;
            nederland-fm.github.io) default_country=nl ;;
            radio-nederland.github.io) default_country=nl; default_site=nl-fm ;;
            radio-internetowe.github.io) default_country=pl ;;
            *) default_country=gr ;;
          esac

          export COUNTRY="${COUNTRY:-$default_country}"
          if [[ "$COUNTRY" == "$default_country" ]]; then
            export SITE="${SITE:-$default_site}"
          fi
          npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
